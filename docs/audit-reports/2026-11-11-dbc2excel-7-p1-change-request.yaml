# dbc2excel-7 P1: sections the requirement says to skip must not fail a file, and text Excel cannot
# store must not break the batch (Codex findings B7-01, B7-02).
# xcompiler run -w <dbc2excel-7> --change-request <this file>
id: ignored-sections-and-unwritable-characters
target: requirement-analysis
summary: >-
  需求 §6.2 规定跳过的段（如 BO_TX_BU_、SG_MUL_VAL_）不得使文件失败；文本含 Excel 无法写入的控制字符时去掉这些字符并照常导出，
  不得中断整批写出。为这两条补上功能验收用例并修正实现。
expected: >-
  其一，输入文件含 §6.2 列出的任一被忽略段时，退出码为 0，该文件的全部信号照常导出，“错误”表不出现该文件；
  真正格式错误的 BO_ 或 SG_ 定义仍使该文件记入“错误”表，退出码为 1。
  其二，注释、单位、取值表等文本含 Excel 无法写入的控制字符时，写入前去掉这些字符，其余文本保留；
  该文件与同批其他文件的信号都照常导出并写出工作簿，退出码不因此变为非 0。
evidence:
  - docs/01-requirement-analysis.md §6.2 规定 BA_、BA_DEF_、BA_DEF_DEF_、VAL_TABLE_、BO_TX_BU_、EV_、SIG_GROUP_、SIG_VALTYPE_、SG_MUL_VAL_ 等段在 P1 中跳过，不影响其余信号导出，也不导致文件失败。
  - 在 tests/fixtures/standard_a.dbc 的副本末尾追加一行 BO_TX_BU_ 291 后导出，退出码为 1，导出信号 0 条，“错误”表报“BO_ 定义不合法”。
  - src/dbc_excel/parser.py 用 startswith("BO_")、startswith("SG_") 判断报文和信号定义，BO_TX_BU_、SG_MUL_VAL_ 因此进入报文或信号定义的校验。
  - 注释含控制字符（例如 U+0001）的文件与一个正常文件同批导出时，openpyxl 抛出 IllegalCharacterError，进程异常退出，没有生成工作簿，正常文件的信号也没有写出。
  - tests/test_functional_acceptance.py 没有覆盖以上两种输入。
affectedArtifacts:
  - docs/01-requirement-analysis.md
  - tests/test_functional_acceptance.py
  - src/dbc_excel/parser.py
  - src/dbc_excel/excel_writer.py
