name: Release

# 推送 v* tag 后，先完成共同发版门禁，再发布 GitHub Release 和已构建的 npm 归档。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      npm-spec: ${{ steps.version.outputs.npm-spec }}
      npm-tag: ${{ steps.version.outputs.npm-tag }}
    steps:
      - name: Checkout tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0   # Release notes use the tag's reachable history.
          persist-credentials: false

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Verify release version
        id: version
        run: |
          npm run version:check
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $PACKAGE_VERSION" >&2
            exit 1
          fi
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          case "${PACKAGE_VERSION%%+*}" in
            *-*) NPM_TAG=next ;;
            *) NPM_TAG=latest ;;
          esac
          echo "npm-spec=$PACKAGE_NAME@$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
          echo "npm-tag=$NPM_TAG" >> "$GITHUB_OUTPUT"

      - name: Type-check (product and tests)
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test (vitest)
        run: npx vitest run

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Build npm package
        run: npm run build

      - name: Verify npm package contents
        run: npm run package:verify

      - name: Pack npm release artifact
        run: |
          mkdir -p "$RUNNER_TEMP/xcompiler-npm-release"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/xcompiler-npm-release"

      - name: Package all targets (linux-x64 / linux-arm64 / macos-arm64 / win-x64)
        run: npm run package:all

      - name: Verify SHA256SUMS
        working-directory: dist/pkg
        run: sha256sum --check SHA256SUMS

      - name: Upload npm release artifact
        uses: actions/upload-artifact@v7
        with:
          name: xcompiler-npm-package
          path: ${{ runner.temp }}/xcompiler-npm-release/*.tgz
          if-no-files-found: error
          overwrite: true

      - name: Extract release notes (commits between prev tag → this tag, or README excerpt for first release)
        id: notes
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          PREV_TAG="$(git describe --tags --abbrev=0 --match 'v*' --exclude "$TAG" "$TAG" 2>/dev/null || true)"

          {
            echo "# XCompiler ${TAG}"
            echo
            if [ -n "${PREV_TAG}" ]; then
              echo "## Changes since ${PREV_TAG}"
              echo
              # 仅取 commit subject（首行），过滤合并提交，按时间正序展示
              git log --no-merges --reverse --pretty=format:'- %s (%h)' "${PREV_TAG}..${TAG}"
              echo
            else
              echo "## About"
              echo
              # 首次发版：从 README.md 摘录项目说明（取首个 H1 之后到下一个 H2 之前的内容）。
              # 若 README 不存在则给出空 about。
              if [ -f README.md ]; then
                awk '
                  /^# / { if (++h1 == 1) { skip_first_h1 = 1; next } }
                  skip_first_h1 && /^## / { exit }
                  skip_first_h1 { print }
                ' README.md
              else
                echo "_(no README.md found; see repo for details)_"
              fi
              echo
            fi
            echo
            echo "## Artifacts"
            echo
            echo "| File | Size | Target |"
            echo "|---|---|---|"
            (
              cd dist/pkg
              for f in xcompiler-*.tar.gz xcompiler-*.zip; do
                size=$(du -h "$f" | cut -f1)
                target="${f#xcompiler-}"; target="${target%.tar.gz}"; target="${target%.zip}"
                echo "| \`$f\` | $size | $target |"
              done
            )
            echo
            echo "校验和见同 release 的 \`SHA256SUMS\` asset。"
          } > RELEASE_BODY.md
          echo "notes_file=$PWD/RELEASE_BODY.md" >> "$GITHUB_OUTPUT"
          echo "prev_tag=${PREV_TAG}" >> "$GITHUB_OUTPUT"
          echo '--- preview ---'
          cat RELEASE_BODY.md

      - name: Create GitHub Release & upload assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: XCompiler ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.notes_file }}
          prerelease: ${{ steps.version.outputs.npm-tag == 'next' }}
          fail_on_unmatched_files: true
          files: |
            dist/pkg/xcompiler-linux-x64.tar.gz
            dist/pkg/xcompiler-linux-arm64.tar.gz
            dist/pkg/xcompiler-macos-arm64.tar.gz
            dist/pkg/xcompiler-win-x64.zip
            dist/pkg/SHA256SUMS

  npm-publish:
    name: Publish npm package
    runs-on: ubuntu-22.04
    needs: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Download checked npm artifact
        uses: actions/download-artifact@v8
        with:
          name: xcompiler-npm-package
          path: ${{ runner.temp }}/xcompiler-npm-release

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PACKAGE_SPEC: ${{ needs.release.outputs.npm-spec }}
          NPM_TAG: ${{ needs.release.outputs.npm-tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          PACKAGES=("$RUNNER_TEMP"/xcompiler-npm-release/*.tgz)
          if [[ "${#PACKAGES[@]}" -ne 1 ]]; then
            echo "Expected exactly one checked npm package archive." >&2
            exit 1
          fi

          if npm publish "${PACKAGES[0]}" --provenance --access public --tag "$NPM_TAG"; then
            exit 0
          fi

          if npm view "${PACKAGE_SPEC}" version >/dev/null 2>&1; then
            echo "${PACKAGE_SPEC} is already available on npm after the trusted publish attempt."
            exit 0
          fi

          echo "Trusted publishing failed; attempting NPM_TOKEN fallback." >&2
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "Trusted publishing failed and NPM_TOKEN is not configured." >&2
            exit 1
          fi
          npm publish "${PACKAGES[0]}" --access public --tag "$NPM_TAG"
