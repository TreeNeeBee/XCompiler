rules:
  - id: cd917fda-2073-5b73-9fcd-0f27e4459bfc
    name: deliverable
    version: 2.0.0
    level: required
    ctime: 2026-10-16T15:15:35Z
    mtime: 2026-10-19T00:00:00Z
    digest: sha256:dfff4d24dcf71bcc1424d89950fbe410f7f56fc1762145e4654335c3a7e89c9f
    description:
      en: "Functional verification deliverable: evidence that the delivered work meets its acceptance criteria."
      zh: 功能验证的交付：证明交付物满足验收标准的证据。
    instruction:
      en: You verify delivered work against its acceptance criteria and report evidence.
      zh: 你负责对照验收标准验证已交付的工作，并报告证据。
  - id: 31c2a391-ad34-5334-a8e2-2af0ab85e509
    name: method
    version: 2.0.0
    level: required
    ctime: 2026-10-16T15:15:35Z
    mtime: 2026-10-19T00:00:00Z
    digest: sha256:c6ff797a2816eef13672b59d0073dd3346b6db9fbe0a843ff77e1b242d27ed1e
    description:
      en: "Functional verification method: inspect the paired tests, add risk supplements, freeze and record results."
      zh: 功能验证的方法：检查配对测试、补充风险用例、冻结并记录结果。
    instruction:
      en: Inspect paired tests, add isolated risk supplements, freeze the suite, and record measured results.
      zh: 检查配对测试，补充隔离的风险测试，冻结测试集，并记录实测结果。
  - id: 452f1fb2-f7ba-5890-acb8-f2a6943455d6
    name: no-source-rewrite
    version: 2.0.0
    level: forbidden
    ctime: 2026-10-16T15:15:35Z
    mtime: 2026-10-19T00:00:00Z
    digest: sha256:78ce30406bf132b156dd81ace39b7c591911f82fb29624dcd9d54cefd5114d8b
    description:
      en: Functional verification does not rewrite source to make a test pass.
      zh: 功能验证不为通过测试而改写源码。
    instruction:
      en: Do not rewrite source to make a test pass.
      zh: 不要为了让测试通过而改写源码。
  - id: 897373ee-9dfb-4d08-9f4d-b69ecf2b1ed9
    name: output-round-trip
    version: 1.0.0
    level: required
    ctime: 2026-10-31T20:05:57.474Z
    mtime: 2026-10-31T20:06:29.407Z
    digest: sha256:b3188c658d89eeb79c41130517761ffab481850701eab37c4f7e19d19645c92b
    description:
      en: "Applies when verifying a product that writes a structured file: the test reloads the file and compares values and types with the source."
      zh: 验证会写出结构化文件的产品时适用：测试要重新读取该文件，比对值和类型。
    instruction:
      en: "Output fidelity: when the product writes a structured file (a spreadsheet, CSV, JSON or similar), reload the written file in the test and compare each value and its type with the source data. That the file exists or opens does not verify its content."
      zh: 输出保真：产品写出结构化文件（电子表格、CSV、JSON 等）时，在测试中重新读取写出的文件，逐项比对值及其类型与源数据是否一致。文件存在或能打开并不能证明内容正确。
  - id: a9516234-2045-4a27-a67d-805e908b53ce
    name: documented-commands
    version: 1.0.0
    level: required
    ctime: 2026-10-31T20:05:57.862Z
    mtime: 2026-10-31T20:06:29.407Z
    digest: sha256:012b93b8cccc24ca9e8a17c52441a36e054eaf756e1d49b2b3b03243acd02ea2
    description:
      en: "Applies when a functional verification Step writes user documentation: every documented command is run and works, and documented fields match the actual output."
      zh: 功能验证 Step 编写用户文档时适用：文档中的每条命令都要实际运行通过，文档中的字段与实际输出一致。
    instruction:
      en: "Documentation: run every command shown in README or the quickstart with run_program in this Step, exactly as documented, and document only invocations that work. Copy field names, column lists and sample output from the actual output of those runs, not from design documents or earlier drafts."
      zh: 文档：在本 Step 中用 run_program 按文档原样运行 README 和快速上手中的每条命令，只写能用的调用方式。字段名、列清单和示例输出从这些运行的实际输出中抄写，不要照搬设计文档或早期草稿。
    applicability:
      tools:
        - run_program
