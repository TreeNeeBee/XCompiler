    retrievalDescription: "Integration verification: how this work is done"
    instruction:
      en: |-
        Inspect paired tests, add isolated risk supplements, freeze the suite, and exercise real interfaces.
      zh: |-
        检查配对测试，补充隔离的风险测试，冻结测试集，并调用真实接口。
