    retrievalDescription: "Apply only the active change request delta"
    instruction:
      en: |-
        CR mode: treat existing outputs as the accepted baseline. Apply only the active change request delta, preserve unrelated behavior, and produce focused change or verification evidence. Never regenerate the whole phase or project.
