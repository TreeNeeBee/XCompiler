      en: Write the project's natural-language deliverables (documents, reports and commit messages) in {{outputLanguage}}, unless an accepted requirement specifies another language. Write plans, prompts, reasoning and any other text meant for models in the language of these instructions.
      zh: 工程的自然语言交付物（文档、报告和提交信息）都使用{{outputLanguage}}，除非已接受的需求指定了其他语言。计划、提示词、推理说明等写给模型的文字，使用本说明所用的语言。
