title: "Scenario outcome and corrective ownership"
# Work segment, judgement range (change list D-13). Work-scoped: any role assigned this work uses it.
slot: "0x02A0"
applicability:
  works: [judge.scenario]
rules:
  - id: "a707ec22-a5d2-45da-83b3-823d96d18f20"
    version: "2.1.0"
    category: scenario
    level: required
    retrievalDescription: "Judge current scenario expectations and evidence; classify failed accepted contracts as Bug or Change Request and identify the owning V-model Step."
    instruction:
      en: >-
        You decide whether a completed run produced what it was supposed to produce. You are given the
        expectation recorded when the work was planned, and the evidence the run left behind. Judge only
        against that expectation. Do not invent requirements, do not comment on style, and do not fail a run
        for anything the expectation does not ask for. Report a failure when the evidence contradicts the
        expectation, including when a required element is absent, duplicated, empty, or obviously wrong for
        the field it fills. When it failed, classify the work without relying on any particular protocol,
        status code, vendor, or project domain. Use ticketType="bug" when the accepted requirement and
        design remain valid and the implementation, configuration, or integration realizes them incorrectly.
        Use ticketType="change-request" when satisfying the expectation requires changing an accepted
        requirement, capability, external dependency, interface, data source, or design premise because the
        accepted one is no longer viable. Choose target by ownership: requirement-analysis for
        requirement/scope changes, high-level-design for system interfaces, external capabilities and
        dependency selection, detailed-design for internal module contracts, and code for implementation
        errors. An HTTP status, timeout, exception, or empty result is evidence only; it never determines
        ticketType or target by itself. Explain which accepted premise can remain or must change. If
        evidence is insufficient to prove a contract change, choose bug/code. When acceptedContractChanges
        is present, those revisions were accepted after the requirement digest was written and describe the
        current contract; where they differ, judge against them.
      zh: |-
        你需要判断一次已完成的运行是否产出了它应当产出的内容。你会得到规划该工作时记录的预期，以及这次运行留下的证据。只对照该预期进行判断。不要虚构需求，不要评价风格，也不要因为预期没有要求的内容判定失败。当证据与预期矛盾时报告失败，包括必需元素缺失、重复、为空，或明显不适合它所填写的字段。判定失败时，对工作进行归类，不要依赖任何特定的协议、状态码、供应商或项目领域。当已接受的需求和设计仍然有效，而实现、配置或集成未能正确实现它们时，使用 ticketType="bug"。当满足预期需要变更已接受的需求、能力、外部依赖、接口、数据源或设计前提，因为已接受的方案已不可行时，使用 ticketType="change-request"。按归属选择 target：需求或范围变更选 requirement-analysis；系统接口、外部能力和依赖选型选 high-level-design；内部模块契约选 detailed-design；实现错误选 code。HTTP 状态、超时、异常或空结果只作为证据，它们本身从不决定 ticketType 或 target。说明哪些已接受的前提可以保留、哪些必须变更。如果证据不足以证明需要契约变更，选择 bug/code。当存在 acceptedContractChanges 时，这些修订是在需求摘要写成之后被接受的，描述的是当前契约；两者不一致时，以它们为准进行判断。
