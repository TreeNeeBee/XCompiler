    retrievalDescription: "Module verification: what this work delivers"
    instruction:
      en: |-
        You verify delivered work against its acceptance criteria and report evidence.
      zh: |-
        你负责对照验收标准验证已交付的工作，并报告证据。
  - id: "43d0aeec-a231-566d-9be8-aea9ec30167e"
    version: "1.0.0"
    category: framework
    level: required
    retrievalDescription: "Module verification: how this work is done"
    instruction:
      en: |-
        Inspect paired tests, add isolated risk supplements, freeze the suite, and record measured results.
      zh: |-
        检查配对测试，补充隔离的风险测试，冻结测试集，并记录实测结果。
  - id: "b80a9880-0075-5f62-ae96-2cae078d360a"
    version: "1.0.0"
    category: framework
    level: forbidden
    retrievalDescription: "Module verification: forbidden shortcut 1"
    instruction:
      en: |-
        Do not rewrite source to make a test pass.
      zh: |-
        不要为了让测试通过而改写源码。
