      zh: 实现不为通过而修改已接受的测试。
    instruction:
      en: Do not change accepted tests to make an implementation pass.
      zh: 不要为了让实现通过而修改已接受的测试。
  - id: 8946bc00-e57a-5b24-8fed-d6816875943b
