    description:
      en: "Implementation method: code and unit tests that satisfy the accepted design and acceptance criteria."
      zh: 实现的方法：编写满足已接受设计与验收标准的代码和单元测试。
    instruction:
      en: Write code and unit tests that satisfy the accepted design and acceptance criteria.
      zh: 编写满足已接受设计和验收标准的代码与单元测试。
  - id: 1a501c5a-9e17-5c7c-a111-3636fb290663
    name: no-test-tampering
    version: 2.0.0
    level: forbidden
    ctime: 2026-10-16T15:15:35Z
    mtime: 2026-10-19T00:00:00Z
    digest: sha256:7fb567233385275bf956895bacb37d7c67101f11a95437a59bfa9074bc0d1101
    description:
