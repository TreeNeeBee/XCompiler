    description:
      en: "Unit verification deliverable: evidence that the delivered work meets its acceptance criteria."
      zh: 单元验证的交付：证明交付物满足验收标准的证据。
    instruction:
      en: You verify delivered work against its acceptance criteria and report evidence.
      zh: 你负责对照验收标准验证已交付的工作，并报告证据。
