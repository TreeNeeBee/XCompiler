rules:
  - id: 0b63d236-37b1-5df4-a644-eed4b66a547f
    name: deliverable
    version: 2.0.0
    level: required
    ctime: 2026-10-16T15:15:35Z
    mtime: 2026-10-19T00:00:00Z
    digest: sha256:25bf89b34b1855f1cdae2663069488fcffc8ad5e22290a04c18fa8af16cfeb1e
    description:
      en: "Unit verification deliverable: evidence that the delivered work meets its acceptance criteria."
      zh: 单元验证的交付：证明交付物满足验收标准的证据。
    instruction:
      en: You verify delivered work against its acceptance criteria and report evidence.
      zh: 你负责对照验收标准验证已交付的工作，并报告证据。
  - id: dca329b3-3f73-5846-afbe-c4f9af5da0a7
    name: method
    version: 2.0.0
    level: required
    ctime: 2026-10-16T15:15:35Z
    mtime: 2026-10-19T00:00:00Z
    digest: sha256:11fbab7be073730c9e57295899ac336c80717c965591115d866201a08eba92ed
    description:
      en: "Unit verification method: inspect the paired tests, add risk supplements, freeze and record results."
      zh: 单元验证的方法：检查配对测试、补充风险用例、冻结并记录结果。
    instruction:
      en: Inspect paired tests, add isolated risk supplements, freeze the suite, and record measured results.
      zh: 检查配对测试，补充隔离的风险测试，冻结测试集，并记录实测结果。
  - id: 2af9c62e-6ba2-5ad2-b163-a092373ee28a
    name: no-source-rewrite
    version: 2.0.0
    level: forbidden
    ctime: 2026-10-16T15:15:35Z
    mtime: 2026-10-19T00:00:00Z
    digest: sha256:26d3a1a0fd497b2a86cf9ad07a79c4cbc8cfc9e64a3c3a622955ab4abdd1a45f
    description:
      en: Unit verification does not rewrite source to make a test pass.
      zh: 单元验证不为通过测试而改写源码。
    instruction:
      en: Do not rewrite source to make a test pass.
      zh: 不要为了让测试通过而改写源码。
  - id: 143cbdb6-fa3b-47fa-b59a-5287ba40ccd6
    name: malformed-input-cases
    version: 1.0.0
    level: required
    ctime: 2026-10-31T20:05:56.307Z
    mtime: 2026-10-31T20:06:29.407Z
    digest: sha256:91385ca6ad4dd263ca105e132b040bd0377109f6bd702e3c2994c3555a9e3395
    description:
      en: "Applies when verifying a module that parses an external input format: its tests include malformed and partially valid input."
      zh: 验证解析外部输入格式的模块时适用：测试要包含格式错误和部分合法的输入。
    instruction:
      en: "Malformed input: for every module that parses an external format, include cases with malformed and partially valid input — unterminated strings, escaped delimiters, unknown sections, truncated content — and assert the error or warning the product reports. Well-formed samples alone do not verify a parser."
      zh: 格式错误的输入：对每个解析外部格式的模块，都要包含格式错误和部分合法输入的用例——未闭合的字符串、转义的分隔符、未知的段落、被截断的内容——并断言产品报告的错误或警告。只用格式正确的样例不足以验证解析器。
